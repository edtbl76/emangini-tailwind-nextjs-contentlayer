# Blog CI on the lab's Woodpecker (weyland B245). Runs the pipeline-script tests (node --test scripts/*.test.mjs,
# JUnit via Node's built-in reporter) and sends the results to Trunk Flaky Tests, pass or fail.
# Woodpecker can't receive GitHub webhooks on the LAN, so runs are started manually (Run pipeline / the CLI).
# Runbook: docs/runbooks/trunk-flaky-tests.md in weyland-lab.

# Pin to the cluster agents: an unlabeled workflow can schedule onto ANY agent, including rogueone's local ones.
labels:
  backend: kubernetes

when:
  - event: [manual, push]
    branch: main

steps:
  - name: test-node
    image: node:22
    commands:
      - corepack enable
      - yarn install --immutable --mode=skip-build
      - mkdir -p reports/junit/node-test
      - node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/junit/node-test/results.xml scripts/*.test.mjs

  # The uploader is weyland-lab's own fail-closed script at a pinned commit, checked against its sha256, running
  # the pinned trunk-analytics-cli. It goes red if Trunk did not confirm the upload. Runs after a red test step too.
  - name: trunk-upload
    image: alpine:3.20
    when:
      - status: [success, failure]
    environment:
      TRUNK_API_TOKEN:
        from_secret: trunk_org_token
      TRUNK_COLLECTION_ID: SnnIoRn8
      TRUNK_REPO_URL: https://github.com/edtbl76/emangini-tailwind-nextjs-contentlayer
      TRUNK_CLI_VERSION: 0.16.1
      TRUNK_CLI_SHA256: 8c34f99a41d4b3151f711aca05d01478b2f707dd698d3980d2524646021af5f2
      UPLOADER_COMMIT: 45c0b1caaf8b53a4647a0fb18dade66b5cdaaf2b
      UPLOADER_SHA256: 09f3887d98e403800cc7a249eb2979b18405dd096a9d823cb8b066d8f8e6dd55
    commands:
      - apk add --no-cache bash curl >/dev/null
      - curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/trunk-cli.tgz "https://github.com/trunk-io/analytics-cli/releases/download/$TRUNK_CLI_VERSION/trunk-analytics-cli-x86_64-unknown-linux.tar.gz"
      - echo "$TRUNK_CLI_SHA256  /tmp/trunk-cli.tgz" | sha256sum -c -
      - mkdir -p /tmp/trunk && tar -xzf /tmp/trunk-cli.tgz -C /tmp/trunk trunk-analytics-cli
      - curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 -o /tmp/trunk-upload.sh "https://raw.githubusercontent.com/edtbl76/weyland-lab/$UPLOADER_COMMIT/scripts/ci/trunk-upload.sh"
      - echo "$UPLOADER_SHA256  /tmp/trunk-upload.sh" | sha256sum -c -
      - TRUNK_CLI=/tmp/trunk/trunk-analytics-cli bash /tmp/trunk-upload.sh reports/junit
